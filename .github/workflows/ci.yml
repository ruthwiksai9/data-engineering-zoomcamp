name: quickstart-ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickstart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt
      - run: . .venv/bin/activate && python scripts/create_sample_data.py
      - run: . .venv/bin/activate && python scripts/seed_duckdb.py
      - run: |
          . .venv/bin/activate
          cd dbt
          DBT_PROFILES_DIR=. dbt deps
          DBT_PROFILES_DIR=. dbt build
